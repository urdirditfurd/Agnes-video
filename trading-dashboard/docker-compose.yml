# =============================================================================
# Trading Dashboard — Docker Compose prod OVH
# HA 24/7 : restart + healthchecks + autoheal (recreate si unhealthy)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    labels:
      - autoheal=true
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - trading-net
    mem_limit: 128m
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "nginx", "-t"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    restart: unless-stopped
    logging: *default-logging
    labels:
      - autoheal=true
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trading-net
    mem_limit: 512m
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    labels:
      - autoheal=true
    env_file:
      - .env
    environment:
      - APP_ROLE=api
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Paris}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    mem_limit: 768m
    stop_grace_period: 20s
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "python", "healthcheck.py"]

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    labels:
      - autoheal=true
    env_file:
      - .env
    environment:
      - APP_ROLE=bot
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Paris}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - BOT_HEALTH_FILE=/tmp/bot_healthy
      - BOT_HEARTBEAT_MAX_AGE_SEC=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - trading-net
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "python", "healthcheck.py"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    labels:
      - autoheal=true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-net
    mem_limit: 1g
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    labels:
      - autoheal=true
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    mem_limit: 320m
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "redis-cli", "ping"]

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    logging: *default-logging
    profiles: ["ssl"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - trading-net
    mem_limit: 128m
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pgrep -f 'certbot|sleep' >/dev/null || exit 1"]

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 20
      AUTOHEAL_START_PERIOD: 60
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - trading-net
    mem_limit: 64m
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pgrep -f autoheal >/dev/null || exit 1"]

networks:
  trading-net:
    driver: bridge
    name: trading-net

volumes:
  postgres_data:
    name: trading_postgres_data
  redis_data:
    name: trading_redis_data
