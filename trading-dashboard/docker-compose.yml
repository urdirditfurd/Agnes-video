# =============================================================================
# Trading Dashboard — orchestration Docker Compose (prod VPS OVH)
# HA 24/7 : restart unless-stopped + healthchecks sur TOUS les services
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Politique de restart commune (crash, OOM, reboot hôte via systemd)
x-restart: &default-restart
  restart: unless-stopped

# Timings healthcheck demandés (interval / timeout / retries / start_period)
x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy + terminaison TLS
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    <<: *default-restart
    logging: *default-logging
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      # Image nginx : pas de Python — validation conf (HTTP/HTTPS gérés par templates)
      test: ["CMD", "nginx", "-t"]

  # ---------------------------------------------------------------------------
  # Frontend Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
    <<: *default-restart
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      # Image Node : pas de Python — HTTP local
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]

  # ---------------------------------------------------------------------------
  # Backend FastAPI (API REST + WebSocket)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *default-restart
    logging: *default-logging
    env_file:
      - .env
    environment:
      - APP_ROLE=api
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Paris}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "python", "healthcheck.py"]

  # ---------------------------------------------------------------------------
  # Worker bot — critique 24/7 (same image, APP_ROLE=bot)
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *default-restart
    logging: *default-logging
    env_file:
      - .env
    environment:
      - APP_ROLE=bot
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-Europe/Paris}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - BOT_HEALTH_FILE=/tmp/bot_healthy
      - BOT_HEARTBEAT_MAX_AGE_SEC=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      # Si unhealthy 3× → Docker stop + recreate (unless-stopped)
      test: ["CMD", "python", "healthcheck.py"]

  # ---------------------------------------------------------------------------
  # PostgreSQL — trades, logs, settings, credentials chiffrés
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  # ---------------------------------------------------------------------------
  # Redis — pub/sub temps réel + cache état bot
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *default-restart
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "redis-cli", "ping"]

  # ---------------------------------------------------------------------------
  # Certbot — renouvellement SSL automatique
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:v2.11.0
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renouvelle toutes les 12h ; nginx recharge via deploy/cron si besoin
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - trading-net
    healthcheck:
      <<: *healthcheck-timing
      # Processus shell de boucle toujours vivant
      test: ["CMD-SHELL", "pgrep -f 'certbot|sleep' >/dev/null || exit 1"]

networks:
  trading-net:
    driver: bridge
    name: trading-net

volumes:
  postgres_data:
    name: trading_postgres_data
  redis_data:
    name: trading_redis_data
