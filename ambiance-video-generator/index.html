<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambiance Video Generator — Agnes IA</title>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #15202b;
    --muted: #667085;
    --line: #e4e7ec;
    --accent: #2563eb;
    --ok: #16a34a;
    --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 0% 0%, #dbeafe 0%, transparent 55%),
      radial-gradient(800px 380px at 100% 0%, #dcfce7 0%, transparent 50%),
      var(--bg);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem 3rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.6rem;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  }
  h1 { margin: 0 0 .35rem; font-size: clamp(1.55rem, 3.5vw, 2rem); letter-spacing: -0.02em; }
  .sub { margin: 0 0 1.35rem; color: var(--muted); line-height: 1.45; }
  .zone {
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 1.25rem;
    text-align: center;
    margin-bottom: .85rem;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .zone:hover { border-color: var(--accent); }
  .zone.on { border-color: var(--ok); background: #f0fdf4; }
  .zone input { display: none; }
  .hint { margin-top: .35rem; font-size: .8rem; color: var(--muted); }
  label.field {
    display: block;
    font-size: .78rem;
    color: var(--muted);
    margin: .2rem 0 .35rem;
  }
  .api {
    width: 100%;
    padding: .8rem .9rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 0 0 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9rem;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 1rem;
    font-size: 1rem;
    font-weight: 650;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:hover:not(:disabled) { filter: brightness(.96); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .progress { display: none; margin-top: 1.1rem; }
  .progress.show { display: block; }
  .bar { height: 10px; background: #eef2f7; border-radius: 999px; overflow: hidden; }
  .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #2563eb);
    transition: width .25s;
  }
  .status { margin-top: .55rem; font-size: .9rem; color: var(--muted); word-break: break-word; }
  .err { color: var(--err); }
  video {
    width: 100%;
    margin-top: 1rem;
    border-radius: 10px;
    background: #000;
    display: none;
  }
  .dl { display: none; margin-top: .85rem; background: var(--ok); }
  .dl.show { display: block; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Ambiance Video Generator</h1>
  <p class="sub">Image → Agnes IA (10&nbsp;s, caméra fixe) → boucle 3&nbsp;h locale (FFmpeg.wasm) → téléchargement MP4</p>

  <div class="zone" id="image-zone">
    <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp,image/*">
    <div id="image-label">Cliquez pour uploader votre image</div>
    <div class="hint">JPG, PNG, WebP — obligatoire</div>
  </div>

  <div class="zone" id="audio-zone">
    <input type="file" id="audio-input" accept="audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/*">
    <div id="audio-label">Cliquez pour uploader votre musique (optionnel)</div>
    <div class="hint">MP3, WAV, OGG — bouclée sur 3&nbsp;h</div>
  </div>

  <label class="field" for="api-key">Clé API Agnes (sk-…)</label>
  <input type="password" class="api" id="api-key" placeholder="sk-…" autocomplete="off">

  <button id="generate-btn" disabled>Générer la vidéo d'ambiance (3h)</button>

  <div class="progress" id="progress">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Préparation…</div>
  </div>

  <video id="preview" controls playsinline></video>
  <button class="dl" id="download-btn">Télécharger MP4 3h</button>
</div></div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
(function () {
  'use strict';

  var AGNES_API_BASE = 'https://apihub.agnes-ai.com/v1';
  var AGNES_POLL_BASE = 'https://apihub.agnes-ai.com/agnesapi';
  var MODEL_VIDEO = 'agnes-video-v2.0';
  var NUM_FRAMES = 240;
  var FRAME_RATE = 24;
  var DURATION_3H = 10800;
  var CORE_CDN = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';

  var AGNES_PROMPT =
    'Animate this uploaded image with subtle, gentle, calming movements only. ' +
    'Keep the composition absolutely static - NO camera movement, NO zoom, NO pan. ' +
    'Add soft ambient motion: gentle breathing, subtle steam or mist rising, soft light flickering, ' +
    'floating dust particles, or gentle water ripples. The mood must be peaceful, relaxing, and meditative. ' +
    'Duration: exactly 10 seconds. Seamless loop. High quality, smooth 24fps.';

  var state = {
    imageDataURL: null,
    audioFile: null,
    apiKey: '',
    isGenerating: false,
    finalBlob: null
  };

  try { state.apiKey = localStorage.getItem('avg_agnes_key') || ''; } catch (e) {}

  var imageZone = document.getElementById('image-zone');
  var imageInput = document.getElementById('image-input');
  var imageLabel = document.getElementById('image-label');
  var audioZone = document.getElementById('audio-zone');
  var audioInput = document.getElementById('audio-input');
  var audioLabel = document.getElementById('audio-label');
  var apiInput = document.getElementById('api-key');
  var generateBtn = document.getElementById('generate-btn');
  var progressEl = document.getElementById('progress');
  var fillEl = document.getElementById('fill');
  var statusEl = document.getElementById('status');
  var preview = document.getElementById('preview');
  var downloadBtn = document.getElementById('download-btn');

  apiInput.value = state.apiKey;

  function setProg(pct, msg, isErr) {
    progressEl.classList.add('show');
    fillEl.style.width = Math.max(0, Math.min(100, pct)) + '%';
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  function updateBtn() {
    generateBtn.disabled = !state.imageDataURL || !state.apiKey || state.isGenerating;
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  async function fetchWith503Retry(url, options, label) {
    var max = 5;
    var delay = 1500;
    var lastErr = null;
    for (var i = 0; i < max; i++) {
      try {
        var res = await fetch(url, options);
        if (res.status !== 503 && res.status !== 429) return res;
        lastErr = new Error((label || 'Agnes') + ' saturé (HTTP ' + res.status + ')');
      } catch (e) {
        lastErr = e;
      }
      setProg(Math.min(55, 20 + i * 5), (label || 'Agnes') + ' — nouvel essai dans ' + Math.round(delay / 1000) + 's…');
      await sleep(delay);
      delay = Math.min(delay * 2, 20000);
    }
    throw lastErr || new Error('Échec réseau Agnes');
  }

  imageZone.addEventListener('click', function () { imageInput.click(); });
  imageInput.addEventListener('change', function () {
    var file = imageInput.files && imageInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      state.imageDataURL = reader.result;
      imageZone.classList.add('on');
      imageLabel.textContent = '✓ ' + file.name;
      updateBtn();
    };
    reader.readAsDataURL(file);
  });

  audioZone.addEventListener('click', function () { audioInput.click(); });
  audioInput.addEventListener('change', function () {
    var file = audioInput.files && audioInput.files[0];
    if (!file) return;
    state.audioFile = file;
    audioZone.classList.add('on');
    audioLabel.textContent = '✓ ' + file.name;
  });

  apiInput.addEventListener('input', function () {
    state.apiKey = apiInput.value.trim();
    try { localStorage.setItem('avg_agnes_key', state.apiKey); } catch (e) {}
    updateBtn();
  });

  async function createAgnesVideo() {
    if (AGNES_PROMPT.indexOf('NO camera movement') < 0 || AGNES_PROMPT.indexOf('NO zoom') < 0) {
      throw new Error('Prompt Agnes invalide (caméra fixe manquante)');
    }

    var res = await fetchWith503Retry(AGNES_API_BASE + '/videos', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + state.apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL_VIDEO,
        prompt: AGNES_PROMPT,
        image: state.imageDataURL,
        num_frames: NUM_FRAMES,
        frame_rate: FRAME_RATE
      })
    }, 'Création Agnes');

    var text = await res.text();
    var data = null;
    try { data = JSON.parse(text); } catch (e) { data = null; }

    if (!res.ok) {
      var msg = (data && data.error && data.error.message) || text.slice(0, 220);
      if (res.status === 401) throw new Error('Clé Agnes invalide');
      throw new Error('Agnes HTTP ' + res.status + ' — ' + msg);
    }
    var id = data && (data.video_id || data.id || data.task_id);
    if (!id) throw new Error('Pas de video_id retourné');
    return id;
  }

  async function pollAgnesVideo(videoId) {
    // court délai initial
    for (var w = 20; w > 0; w--) {
      setProg(25, 'Agnes prépare la boucle… ' + w + 's');
      await sleep(1000);
    }

    for (var i = 0; i < 90; i++) {
      var url = AGNES_POLL_BASE +
        '?video_id=' + encodeURIComponent(videoId) +
        '&model_name=' + encodeURIComponent(MODEL_VIDEO);

      var res = await fetchWith503Retry(url, {
        method: 'GET',
        headers: { 'Authorization': 'Bearer ' + state.apiKey }
      }, 'Polling Agnes');

      var data = await res.json();
      if (!res.ok) {
        var msg = (data && data.error && data.error.message) || ('HTTP ' + res.status);
        throw new Error('Poll Agnes: ' + msg);
      }

      var st = String(data.status || data.state || '').toLowerCase();
      var p = Number(data.progress) || 0;
      setProg(30 + Math.min(30, p * 0.3), 'Génération Agnes… ' + (p ? p + '%' : (i + 1)));

      if (st === 'completed' || st === 'succeeded' || st === 'ready' || st === 'done') {
        var videoUrl =
          (data.metadata && data.metadata.url) ||
          data.url ||
          (data.output && data.output.url) ||
          data.video_url;
        if (!videoUrl) throw new Error('Vidéo prête sans URL');
        return videoUrl;
      }
      if (st === 'failed' || st === 'error' || st === 'cancelled') {
        throw new Error('Échec génération Agnes (' + st + ')');
      }
      await sleep(10000);
    }
    throw new Error('Délai maximal dépassé (Agnes)');
  }

  async function loadFFmpeg(onMsg) {
    if (typeof FFmpegWASM === 'undefined' || typeof FFmpegUtil === 'undefined') {
      throw new Error('FFmpeg.wasm CDN non chargé — vérifiez unpkg.com / réseau');
    }
    var FFmpeg = FFmpegWASM.FFmpeg;
    var toBlobURL = FFmpegUtil.toBlobURL;
    var ffmpeg = new FFmpeg();
    ffmpeg.on('log', function (e) {
      if (e && e.message) console.log('[ffmpeg]', e.message);
    });
    if (onMsg) onMsg('Chargement FFmpeg.wasm (unpkg)…');
    await ffmpeg.load({
      coreURL: await toBlobURL(CORE_CDN + '/ffmpeg-core.js', 'text/javascript'),
      wasmURL: await toBlobURL(CORE_CDN + '/ffmpeg-core.wasm', 'application/wasm')
    });
    return ffmpeg;
  }

  /**
   * Boucle 3h : -c:v copy (évite OOM libx264 sur 10800s dans le navigateur).
   * Audio seul est ré-encodé en AAC.
   */
  async function create3HourLoop(videoBlob, audioFile) {
    var ffmpeg = await loadFFmpeg(function (m) { setProg(72, m); });
    var fetchFile = FFmpegUtil.fetchFile;

    setProg(78, 'Écriture fichiers dans FFmpeg…');
    await ffmpeg.writeFile('input.mp4', await fetchFile(videoBlob));

    var args;
    if (audioFile) {
      await ffmpeg.writeFile('input_audio.mp3', await fetchFile(audioFile));
      args = [
        '-stream_loop', '-1', '-i', 'input.mp4',
        '-stream_loop', '-1', '-i', 'input_audio.mp3',
        '-map', '0:v:0', '-map', '1:a:0',
        '-c:v', 'copy',
        '-c:a', 'aac', '-b:a', '128k',
        '-t', String(DURATION_3H),
        '-shortest',
        '-movflags', '+faststart',
        'output.mp4'
      ];
    } else {
      args = [
        '-stream_loop', '-1', '-i', 'input.mp4',
        '-c:v', 'copy',
        '-an',
        '-t', String(DURATION_3H),
        '-movflags', '+faststart',
        'output.mp4'
      ];
    }

    setProg(82, 'Assemblage boucle 3h (local)…');
    try {
      await ffmpeg.exec(args);
    } catch (e1) {
      if (!audioFile) throw e1;
      setProg(84, 'Repli FFmpeg…');
      await ffmpeg.exec([
        '-stream_loop', '-1', '-i', 'input.mp4',
        '-stream_loop', '-1', '-i', 'input_audio.mp3',
        '-c:v', 'copy', '-c:a', 'aac', '-b:a', '128k',
        '-t', String(DURATION_3H), '-shortest', 'output.mp4'
      ]);
    }

    setProg(95, 'Lecture fichier final…');
    var data = await ffmpeg.readFile('output.mp4');
    var buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
    var blob = new Blob([buf], { type: 'video/mp4' });
    if (!blob.size) throw new Error('Fichier final vide');
    return blob;
  }

  async function generateVideo() {
    if (!state.imageDataURL || !state.apiKey || state.isGenerating) return;
    state.isGenerating = true;
    updateBtn();
    downloadBtn.classList.remove('show');
    preview.style.display = 'none';
    state.finalBlob = null;

    try {
      setProg(8, 'Envoi à Agnes IA…');
      var videoId = await createAgnesVideo();
      setProg(20, 'Tâche créée — attente rendu…');
      var videoUrl = await pollAgnesVideo(videoId);

      setProg(65, 'Téléchargement vidéo Agnes…');
      var vRes = await fetch(videoUrl);
      if (!vRes.ok) throw new Error('Téléchargement vidéo HTTP ' + vRes.status);
      var videoBlob = await vRes.blob();
      if (videoBlob.size < 500) throw new Error('Vidéo Agnes vide');

      setProg(70, 'Création de la boucle 3h…');
      var finalBlob = await create3HourLoop(videoBlob, state.audioFile);
      state.finalBlob = finalBlob;

      setProg(100, '✓ Vidéo 3h prête · ' + (finalBlob.size / 1024 / 1024).toFixed(1) + ' Mo');
      preview.src = URL.createObjectURL(finalBlob);
      preview.style.display = 'block';
      downloadBtn.classList.add('show');
    } catch (err) {
      console.error(err);
      setProg(0, '✗ ' + (err && err.message ? err.message : String(err)), true);
    } finally {
      state.isGenerating = false;
      updateBtn();
    }
  }

  generateBtn.addEventListener('click', generateVideo);
  downloadBtn.addEventListener('click', function () {
    if (!state.finalBlob) return;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(state.finalBlob);
    a.download = 'ambiance-video-3h.mp4';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });

  updateBtn();
})();
</script>
</body>
</html>
